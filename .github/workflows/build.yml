name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore tests/EraseLauncher.Tests/EraseLauncher.Tests.csproj
      - name: Build
        run: dotnet build src/EraseLauncher/EraseLauncher.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/EraseLauncher.Tests/EraseLauncher.Tests.csproj -c Release --no-restore --no-build
